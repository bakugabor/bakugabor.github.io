<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://api.github.com https://github.com https://raw.githubusercontent.com https://*.workers.dev; frame-ancestors 'none'; base-uri 'none'; form-action 'none'">
  <title>Autofólie DS – admin</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#17212b;background:#eef2f5}.app{max-width:1120px;margin:auto;padding:22px}.top{background:#102431;color:#fff;border-radius:14px;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:19px;font-weight:800}.brand b{color:#f47721}.shell{display:grid;grid-template-columns:210px 1fr;gap:18px;margin-top:18px}.side,.panel,.login{background:#fff;border:1px solid #d8e0e5;border-radius:12px}.side{padding:10px;height:max-content}.nav{width:100%;border:0;background:transparent;color:#34414c;text-align:left;padding:12px;border-radius:8px;font-size:14px;font-weight:650}.nav.active{background:#f47721;color:#fff}.panel{padding:24px}.panel h1{font-size:23px;margin:0 0 5px}.lead{color:#667583;margin:0 0 20px}.category{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.category button,.secondary{border:1px solid #cfd9df;background:#fff;color:#263744;border-radius:8px;padding:9px 12px;font-weight:650}.category button.active{background:#102431;border-color:#102431;color:#fff}.drop{border:2px dashed #f47721;border-radius:12px;background:#fff8f2;padding:28px;text-align:center}.drop strong{display:block;font-size:17px}.drop span{display:block;color:#687783;font-size:13px;margin-top:7px}.file-input{margin-top:13px;max-width:330px}.queue{margin-top:18px}.item{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid #e5eaee}.thumb{width:72px;height:54px;border-radius:7px;object-fit:cover;background:#edf1f3}.item strong{display:block;font-size:14px}.item small{color:#6d7a85}.status{font-size:12px;color:#188354}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.primary{border:0;border-radius:8px;background:#f47721;color:#fff;padding:11px 15px;font-weight:750}.notice{margin:0 0 14px;padding:11px 13px;border-radius:8px;background:#eaf7f0;color:#12663d}.notice.error{background:#fff0ee;color:#a83025}.hidden{display:none!important}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px;font-size:13px;font-weight:650}.field input,.field textarea{font:inherit;border:1px solid #cbd6dd;border-radius:8px;padding:10px;background:#fff}.login{max-width:500px;margin:12vh auto;padding:30px;text-align:center}.login h1{margin:12px 0 8px}.login p{color:#687783}.footer-note{font-size:12px;color:#6f7e88;margin-top:17px}@media(max-width:720px){.app{padding:10px}.top{border-radius:10px;padding:15px}.shell{grid-template-columns:1fr;gap:10px}.side{display:flex;overflow:auto;padding:7px}.nav{white-space:nowrap;width:auto}.panel{padding:17px}.form-grid{grid-template-columns:1fr}.item{grid-template-columns:58px 1fr}.thumb{width:58px;height:48px}.status{grid-column:2}}
  </style>
</head>
<body><main class="app">
  <section id="login" class="login"><div class="brand">AUTOFÓLIE <b>DS</b></div><h1>Tartalomkezelő</h1><p>Gyors kép- és szövegszerkesztés. A belépés a saját GitHub-fiókoddal védett.</p><button id="login-button" class="primary" type="button">Belépés GitHubbal</button></section>
  <section id="app" class="hidden"><header class="top"><div class="brand">AUTOFÓLIE <b>DS</b> · Admin</div><small>Biztonságos GitHub-belépés</small></header><div class="shell"><nav class="side"><button class="nav active" data-view="gallery" type="button">Képek feltöltése</button><button class="nav" data-view="home" type="button">Főoldal szövegei</button><button class="nav" data-view="prices" type="button">Árak és kategóriák</button></nav><section id="content" class="panel"></section></div></section>
</main><script>
const owner='bakugabor',repo='bakugabor.github.io',branch='main',tokenKey='autofolieds_admin_token';
const state={token:localStorage.getItem(tokenKey)||'',category:'ppf',files:[],gallery:null,home:null,prices:null};
const content=document.getElementById('content'),login=document.getElementById('login'),app=document.getElementById('app');
const categories={ppf:'PPF',tint:'Üvegsötétítés',wrap:'Wrap / dechrome',building:'Épületfólia',lights:'Lámpafólia'};
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(path,options={}){const response=await fetch('https://api.github.com'+path,{...options,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+state.token,'X-GitHub-Api-Version':'2022-11-28',...(options.headers||{})}});if(!response.ok)throw Error('GitHub hiba: '+response.status);return response.status===204?null:response.json()}
async function getFile(path){const item=await api(`/repos/${owner}/${repo}/contents/${path}?ref=${branch}`);const text=new TextDecoder().decode(Uint8Array.from(atob(item.content.replace(/\n/g,'')),c=>c.charCodeAt(0)));return{data:JSON.parse(text),sha:item.sha}}
function putFile(path,data,sha,message){return api(`/repos/${owner}/${repo}/contents/${path}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2)+'\n'))),sha,branch})})}
function alertBox(text,error=false){return`<p class="notice ${error?'error':''}">${esc(text)}</p>`}
async function loadData(){[state.gallery,state.home,state.prices]=await Promise.all([getFile('content/gallery.json'),getFile('content/home.json'),getFile('content/price-editor.json')])}
function nav(){document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.view)})}
function renderGallery(note='',bad=false){const tabs=Object.entries(categories).map(([key,label])=>`<button class="${key===state.category?'active':''}" data-category="${key}" type="button">${label}</button>`).join('');const queued=state.files.map((f,i)=>`<div class="item"><img class="thumb" src="${f.preview}" alt=""><div><strong>${esc(f.name)}</strong><small>${Math.round(f.size/104857.6)/10} MB · ${i+1}. hely</small></div><span class="status">Feltöltésre kész</span></div>`).join('');const existing=(state.gallery.data[state.category]||[]).map((entry,i)=>`<div class="item"><img class="thumb" src="${esc(entry.image)}" alt=""><div><strong>${i+1}. meglévő kép</strong><small>${esc(entry.image.split('/').pop())}</small></div><span class="status">Éles</span></div>`).join('');content.innerHTML=`<h1>Több kép feltöltése</h1><p class="lead">Több képet kijelölhetsz egyszerre. Az új képek egyetlen mentéssel kerülnek fel, mindig a galéria elejére.</p>${note?alertBox(note,bad):''}<div class="category">${tabs}</div><label class="drop"><strong>+ Képek kiválasztása</strong><span>JPG, PNG vagy WebP · több kép egyszerre</span><input id="files" class="file-input" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><section class="queue"><h2>Feltöltésre váró képek</h2>${queued||'<p class="lead">Még nincs kiválasztott kép.</p>'}</section><div class="actions"><button id="upload" class="primary" type="button" ${state.files.length?'':'disabled'}>${state.files.length} kép feltöltése</button><button id="clear" class="secondary" type="button">Lista ürítése</button></div><section class="queue"><h2>Már feltöltött képek</h2>${existing||'<p class="lead">Ebben a kategóriában még nincs feltöltött kép.</p>'}</section><p class="footer-note">A feltöltés közben ne zárd be az oldalt. A mentés után a weboldal rövidesen frissül.</p>`;content.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{state.category=b.dataset.category;renderGallery()});content.querySelector('#files').onchange=e=>{state.files=[...e.target.files].map(file=>({file,name:file.name,size:file.size,preview:URL.createObjectURL(file)}));renderGallery()};content.querySelector('#clear').onclick=()=>{state.files.forEach(x=>URL.revokeObjectURL(x.preview));state.files=[];renderGallery()};content.querySelector('#upload').onclick=uploadImages}
const fileBase64=file=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)});
async function uploadImages(){try{renderGallery('Feltöltés folyamatban…');const uploaded=[];for(const item of state.files){const safe=item.name.toLowerCase().replace(/[^a-z0-9._-]/g,'-');const path=`uploads/${Date.now()}-${safe}`;await api(`/repos/${owner}/${repo}/contents/${path}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Új galériakép feltöltése',content:await fileBase64(item.file),branch})});uploaded.push({image:'/'+path})}const fresh=await getFile('content/gallery.json');fresh.data[state.category]=[...uploaded,...(fresh.data[state.category]||[])];await putFile('content/gallery.json',fresh.data,fresh.sha,'Galéria frissítése');state.gallery=await getFile('content/gallery.json');state.files=[];renderGallery('A képek sikeresen felkerültek.')}catch(error){renderGallery('A feltöltés nem sikerült: '+error.message,true)}}
function renderHome(note='',bad=false){const row=lang=>['eyebrow','title','accent','lead'].map(k=>`<label class="field">${k}<input data-home="${lang}|${k}" value="${esc(state.home.data[lang][k])}"></label>`).join('');content.innerHTML=`<h1>Főoldal szövegei</h1><p class="lead">A szlovák és magyar verzió itt külön, egy helyen módosítható.</p>${note?alertBox(note,bad):''}<h2>Magyar</h2><div class="form-grid">${row('hu')}</div><h2>Szlovák</h2><div class="form-grid">${row('sk')}</div><div class="actions"><button id="save-home" class="primary" type="button">Szöveg mentése</button></div>`;content.querySelector('#save-home').onclick=async()=>{content.querySelectorAll('[data-home]').forEach(i=>{const [lang,key]=i.dataset.home.split('|');state.home.data[lang][key]=i.value});try{await putFile('content/home.json',state.home.data,state.home.sha,'Főoldal szöveg frissítése');state.home=await getFile('content/home.json');renderHome('Mentve.')}catch(e){renderHome(e.message,true)}}}
function renderPrices(note='',bad=false){const fields=[];const walk=(value,path=[])=>{if(typeof value==='string')fields.push(`<label class="field">${esc(path.join(' · '))}<input data-price="${esc(path.join('|'))}" value="${esc(value)}"></label>`);else if(Array.isArray(value))value.forEach((v,i)=>walk(v,[...path,String(i)]));else Object.entries(value).forEach(([k,v])=>walk(v,[...path,k]))};walk(state.prices.data);content.innerHTML=`<h1>Árak és kategóriák</h1><p class="lead">Itt minden ár és kategórianév módosítható. Egy mentés a két nyelvű oldalt is frissíti.</p>${note?alertBox(note,bad):''}<div class="form-grid">${fields.join('')}</div><div class="actions"><button id="save-prices" class="primary" type="button">Árak mentése</button></div>`;const assign=(obj,path,value)=>{let t=obj;path.forEach((part,i)=>{const key=/^\d+$/.test(part)?Number(part):part;if(i===path.length-1)t[key]=value;else t=t[key]})};content.querySelector('#save-prices').onclick=async()=>{content.querySelectorAll('[data-price]').forEach(i=>assign(state.prices.data,i.dataset.price.split('|'),i.value));try{await putFile('content/price-editor.json',state.prices.data,state.prices.sha,'Árlista frissítése');state.prices=await getFile('content/price-editor.json');renderPrices('Mentve.')}catch(e){renderPrices(e.message,true)}}}
function render(view){if(view==='gallery')renderGallery();if(view==='home')renderHome();if(view==='prices')renderPrices()}
async function start(){try{await loadData();login.classList.add('hidden');app.classList.remove('hidden');nav();renderGallery()}catch(e){state.token='';localStorage.removeItem(tokenKey);document.querySelector('#login p').textContent='A belépés lejárt. Jelentkezz be újra.'}}
document.querySelector('#login-button').onclick=()=>{const popup=window.open('https://autofolieds-cms-auth.bakugabor.workers.dev/auth','autofolieds-auth','width=600,height=720');window.addEventListener('message',function listener(event){if(event.data==='authorizing:github'){event.source.postMessage('authorizing:github',event.origin);return}if(typeof event.data==='string'&&event.data.startsWith('authorization:github:success:')){state.token=JSON.parse(event.data.slice(29)).token;localStorage.setItem(tokenKey,state.token);window.removeEventListener('message',listener);popup?.close();start()}})};
if(state.token)start();
</script></body></html>
